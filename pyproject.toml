[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentevalops"
version = "0.1.0"
description = "Deterministic e-commerce support agent for evaluation engineering practice"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AgentEvalOps contributors" }]
# M3 起 v3 的编排层用 LangGraph。它是运行期依赖，不是可选项：
# pipeline.py 一旦导入失败，v3 的所有用例都会变成「测试环境问题」，分数没有意义。
dependencies = ["langgraph>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
llm = ["openai>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agentevalops.data" = ["*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src", "tests"]

