[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentevalops"
version = "1.0.0"
description = "Evaluation platform for a RAG tool-using e-commerce support agent: versioned cases, traces, judges, and regression gates"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "lixincilee" }]
# M3 起 v3 的编排层用 LangGraph。它是运行期依赖，不是可选项：
# pipeline.py 一旦导入失败，v3 的所有用例都会变成「测试环境问题」，分数没有意义。
dependencies = ["langgraph>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
llm = ["openai>=1.0"]
# M4 的压测链路：HTTP 服务（api）+ Locust 负载生成器（perf）。
# 它们是可选依赖，因为单元测试与故障用例全都不需要它们：装不上也不该让主干测试变红。
api = ["fastapi>=0.110", "uvicorn>=0.27"]
perf = ["locust>=2.20"]
# M8 的 trace 出口。**可选**且未在本机验证过：没有 Langfuse 账号，也没装这个 SDK。
# 不装也不影响任何测试与评测：缺它时 LangfuseEmitter 降级成 dry-run（见 docs/tracing.md）。
trace = ["langfuse>=3.0"]
# M9 的判分分层：Ragas（L3，RAG 指标）+ DeepEval（L4，LLM-as-a-Judge）。
# 这两个框架会把 openai 从 2.x 降到 1.x（本机主环境是 2.44）—— **不要装进主解释器**，
# 否则确定性测试基线的依赖形状就被它们改了。请建独立 venv（见 docs/judging.md）：
#   python -m venv .venv-judge
#   .venv-judge\Scripts\pip install -e ".[judge,dev,llm,api]"
# langchain-community 0.4 拆走了 ragas 0.4 依赖的 vertexai 模块，import 直接炸；
# 固定 <0.4 是实测能跑通的组合，不是保守。
judge = ["ragas>=0.4,<0.5", "langchain-community<0.4", "deepeval>=4.3,<5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agentevalops.data" = ["*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src", "tests"]

