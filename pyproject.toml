[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentevalops"
version = "0.1.0"
description = "Deterministic e-commerce support agent for evaluation engineering practice"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AgentEvalOps contributors" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]
llm = ["openai>=1.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agentevalops.data" = ["*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src", "tests"]

