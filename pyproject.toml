[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "agentevalops"
version = "0.1.0"
description = "Deterministic e-commerce support agent for evaluation engineering practice"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "AgentEvalOps contributors" }]
# M3 起 v3 的编排层用 LangGraph。它是运行期依赖，不是可选项：
# pipeline.py 一旦导入失败，v3 的所有用例都会变成「测试环境问题」，分数没有意义。
dependencies = ["langgraph>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]
llm = ["openai>=1.0"]
# M4 的压测链路：HTTP 服务（api）+ Locust 负载生成器（perf）。
# 它们是可选依赖，因为单元测试与故障用例全都不需要它们：装不上也不该让主干测试变红。
api = ["fastapi>=0.110", "uvicorn>=0.27"]
perf = ["locust>=2.20"]
# M8 的 trace 出口。**可选**且未在本机验证过：没有 Langfuse 账号，也没装这个 SDK。
# 不装也不影响任何测试与评测：缺它时 LangfuseEmitter 降级成 dry-run（见 docs/tracing.md）。
trace = ["langfuse>=3.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"agentevalops.data" = ["*.json"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["src", "tests"]

